{% extends "base.html" %}
{% block title %}Page not found — {{ site.site_name }}{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="error-code">404</div>
    <h1>This scene doesn't exist.</h1>
    <p>The page you're looking for may have been moved, deleted, or never made it past the cutting room floor.</p>
    <div class="hero-actions" style="justify-content:center">
      <a class="btn btn-primary" href="{{ url_for('main.index') }}">Back to home</a>
      <a class="btn btn-ghost" href="{{ url_for('main.browse') }}">Browse the catalog</a>
    </div>
  </div>
</div>
{% endblock %}
