<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/dodobook.png">
    <title>Login - Dodobook</title>
    <style>
        :root{--bg:#071428;--panel:#0b2742;--card:#0f3b61;--accent:#1e66b0;--muted:#234a6f;--text:#e6f2ff;--muted-text:#bcd4f2;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
        html,body{height:100%;margin:0;background: linear-gradient(180deg,var(--bg),#062033 80%);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
        body{overflow:auto}
        header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:linear-gradient(90deg,rgba(255,255,255,0.02),transparent);backdrop-filter:blur(4px)}
        header h1{font-size:18px;margin:0}
        header .actions{display:flex;gap:10px;align-items:center}
        header button{background:var(--panel);border:1px solid rgba(255,255,255,0.03);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;transition:all 0.2s ease}
        header button:hover{background:var(--accent);border-color:var(--accent);color:white}
        .center{max-width:540px;margin:40px auto;padding:18px}
        .panel{background:linear-gradient(180deg,var(--panel),var(--card));border-radius:12px;padding:24px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 6px 18px rgba(2,6,23,0.6)}
        label{display:block;margin:10px 0 6px;color:var(--muted-text)}
        input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text);transition:all 0.2s ease;box-sizing:border-box}
        input:focus{outline:none;border-color:var(--accent);background:rgba(30,102,176,0.05)}
        .actions-row{display:flex;gap:8px;margin-top:12px}
        .pill{background:var(--accent);color:white;border:1px solid var(--accent);padding:10px 16px;border-radius:8px;cursor:pointer;transition:all 0.2s ease;font-weight:500}
        .pill:hover{background:rgba(30,102,176,0.8);border-color:rgba(30,102,176,0.8)}
        .pill-secondary{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted-text)}
        .pill-secondary:hover{background:rgba(255,255,255,0.05);color:var(--text)}
        .error-box{background:rgba(232,107,107,0.1);border-left:3px solid rgba(232,107,107,0.6);padding:12px;border-radius:8px;margin-bottom:14px;color:#ffd6d6;font-size:13px}
        .info-box{background:rgba(30,102,176,0.1);border-left:3px solid var(--accent);padding:12px;border-radius:8px;margin-bottom:14px;color:var(--text);font-size:13px}
    </style>
</head>
<body>
    <header>
        <h1>Dodobook</h1>
    </header>

    <main class="center">
        <div class="panel">
            <h2 style="margin-top:0">Log in to your account</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for category, message in messages %}
                <div class="{{ 'info-box' if category == 'info' else 'error-box' }}">{{ message }}</div>
              {% endfor %}
            {% endwith %}

            <form method="POST" action="/login">
                <label for="email">Email or username</label>
                <input id="email" name="email" placeholder="you@example.com" autocomplete="username">

                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="••••••" autocomplete="current-password">

                <div class="actions-row">
                    <button type="submit" class="pill">Log in</button>
                    <button type="button" class="pill pill-secondary" onclick="location.href='/signup'">Sign up</button>
                </div>
                <div style="margin-top:12px;font-size:13px;color:var(--muted-text)">
                    <a href="/forgot-password" style="color:var(--muted-text);text-decoration:underline;cursor:pointer">Forgot password?</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
