<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/facicon.ico">
    <title>Forgot Password - Dodobook</title>
    <style>
        :root{--bg:#071428;--panel:#0b2742;--card:#0f3b61;--accent:#1e66b0;--muted:#234a6f;--text:#e6f2ff;--muted-text:#bcd4f2;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
        html,body{height:100%;margin:0;background: linear-gradient(180deg,var(--bg),#062033 80%);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
        body{overflow:auto}
        header{display:flex;align-items:center;padding:18px 24px;background:linear-gradient(90deg,rgba(255,255,255,0.02),transparent);backdrop-filter:blur(4px)}
        header h1{font-size:18px;margin:0}
        .center{max-width:540px;margin:40px auto;padding:18px}
        .panel{background:linear-gradient(180deg,var(--panel),var(--card));border-radius:12px;padding:24px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 6px 18px rgba(2,6,23,0.6)}
        label{display:block;margin:10px 0 6px;color:var(--muted-text)}
        input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text);transition:all 0.2s ease;box-sizing:border-box}
        input:focus{outline:none;border-color:var(--accent);background:rgba(30,102,176,0.05)}
        .actions-row{display:flex;gap:8px;margin-top:12px}
        .pill{background:var(--accent);color:white;border:1px solid var(--accent);padding:10px 16px;border-radius:8px;cursor:pointer;transition:all 0.2s ease;font-weight:500}
        .pill:hover{background:rgba(30,102,176,0.8)}
        .pill-secondary{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted-text)}
        .pill-secondary:hover{background:rgba(255,255,255,0.05);color:var(--text)}
        .info-box{background:rgba(30,102,176,0.08);border-left:3px solid var(--accent);padding:12px;border-radius:8px;margin:12px 0;color:var(--text);font-size:13px}
    </style>
</head>
<body>
    <header>
        <h1>Dodobook</h1>
    </header>
    <main class="center">
        <div class="panel">
            <h2 style="margin-top:0">Forgot Password</h2>
            <div class="info-box">
                Enter your username or email. An admin will receive your request and set a new password for you — they'll contact you through another channel.
            </div>
            <form method="POST" action="/forgot-password">
                <label for="identifier">Username or Email</label>
                <input id="identifier" name="identifier" placeholder="you@example.com" required>
                <div class="actions-row">
                    <button type="submit" class="pill">Submit Request</button>
                    <button type="button" class="pill pill-secondary" onclick="location.href='/login'">Back to Login</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
